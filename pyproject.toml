[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vspml"
version = "0.1.0"
description = "VSP ML: Zero-VRAM Decision Model Fine-Tuning CLI via Google Colab MCP"
readme = "README_PYPI.md"
authors = [{ name = "Vishnu Suresh Perumbavoor" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["decision-models", "colab", "mcp", "fine-tuning", "modernbert", "laya", "deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0"
]

[project.urls]
Homepage = "https://github.com/vishnusureshperumbavoor/Vibe-ML-Studio"

[project.scripts]
vspml = "vspml.cli:main"
vibeml = "vspml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vspml*"]
